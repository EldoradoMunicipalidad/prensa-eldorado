services:
  prensa-eldorado:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DIRECTUS_URL: /directus
        VITE_DIRECTUS_PUBLIC_FOLDER_ID: ${VITE_DIRECTUS_PUBLIC_FOLDER_ID:?Define VITE_DIRECTUS_PUBLIC_FOLDER_ID en Dokploy}
    expose:
      - "80"
    restart: unless-stopped
